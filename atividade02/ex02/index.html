<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desenho de Retas e Triângulos com Bresenham</title>
    <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Algoritmo de Bresenham (Retas e Triângulos)</h1>
        <canvas id="canvas" width="800" height="600"></canvas>
        <div class="info">
            <b>Modos:</b> Tecla 'R' (Reta - 2 cliques) | Tecla 'T' (Triângulo - 3 cliques)<br>
            <b>Cores:</b> Teclas 0 a 9 para alterar a cor da figura.
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
