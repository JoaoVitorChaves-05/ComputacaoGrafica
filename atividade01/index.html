<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        div {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            width: 100%;
            height: 100vh;
            background-color: #ccc;
        }

        div .item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 480px;
            height: 480px;
            background-color: #5a2929;

            border-radius: 15px;
        }

        canvas {
            width: 360px;
            height: 360px;
            border: 1px solid #000;
            background-color: #fff;
        }

        h2 {
            margin-top: 12px;
            color: #fff;
            font-size: 20px;
            font-weight: normal;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <div class="item">
            <canvas></canvas>
            <h2>Flower</h2>
        </div>
        <div class="item">
            <canvas></canvas>
            <h2>Robot</h2>
        </div>
        <div class="item">
            <canvas></canvas>
            <h2>Car</h2>
        </div>
    </div>
    <script>
        // Configuração inicial compartilhada pelos canvases.
        const vertexShaderSource = `#version 300 es
            in vec2 position;

            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        const fragmentShaderSource = `#version 300 es
            precision mediump float;

            uniform vec4 color;
            out vec4 outColor;

            void main() {
                outColor = color;
            }
        `;

        const canvasConfigurations = [
            {
                vertices: [
                    0.0, 0.0,
                    0.0, 0.55,
                    0.21, 0.21,
                    0.55, 0.0,
                    0.21, -0.21,
                    0.0, -0.55,
                    -0.21, -0.21,
                    -0.55, 0.0,
                    -0.21, 0.21,
                    0.0, 0.55,
                ],
                color: [1.0, 0.25, 0.55, 1.0],
                mode: 'TRIANGLE_FAN',
            },
            {
                parts: [
                    {
                        vertices: [
                            -0.42, -0.35, 0.42, -0.35, 0.42, 0.45,
                            -0.42, -0.35, 0.42, 0.45, -0.42, 0.45,
                        ],
                        color: [0.0, 0.35, 0.9, 1.0],
                        mode: 'TRIANGLES',
                    },
                    {
                        vertices: [
                            -0.23, 0.12, -0.1, 0.12, -0.1, 0.25,
                            -0.23, 0.12, -0.1, 0.25, -0.23, 0.25,
                            0.1, 0.12, 0.23, 0.12, 0.23, 0.25,
                            0.1, 0.12, 0.23, 0.25, 0.1, 0.25,
                        ],
                        color: [0.02, 0.02, 0.02, 1.0],
                        mode: 'TRIANGLES',
                    },
                    {
                        vertices: [
                            -0.03, 0.45, 0.03, 0.45, 0.0, 0.75,
                            -0.08, 0.75, 0.08, 0.75, 0.0, 0.84,
                        ],
                        color: [0.0, 0.35, 0.9, 1.0],
                        mode: 'TRIANGLES',
                    },
                ],
            },
            {
                parts: [
                    {
                        vertices: [
                            -0.68, -0.3, 0.68, -0.3, 0.68, 0.12,
                            -0.68, -0.3, 0.68, 0.12, -0.68, 0.12,
                        ],
                        color: [0.9, 0.1, 0.05, 1.0],
                        mode: 'TRIANGLES',
                    },
                    {
                        vertices: [
                            -0.42, 0.12, -0.2, 0.48, 0.2, 0.48,
                            -0.42, 0.12, 0.2, 0.48, 0.48, 0.12,
                        ],
                        color: [0.1, 0.55, 0.85, 1.0],
                        mode: 'TRIANGLES',
                    },
                    {
                        vertices: [
                            -0.43, -0.48, -0.25, -0.48, -0.25, -0.3,
                            -0.43, -0.48, -0.25, -0.3, -0.43, -0.3,
                        ],
                        color: [0.03, 0.03, 0.03, 1.0],
                        mode: 'TRIANGLES',
                    },
                    {
                        vertices: [
                            0.43, -0.3, 0.43, -0.48, 0.61, -0.48,
                            0.43, -0.3, 0.61, -0.48, 0.61, -0.3,
                        ],
                        color: [0.03, 0.03, 0.03, 1.0],
                        mode: 'TRIANGLES',
                    },
                ],
            },
        ];

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);

            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Error compiling shader:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }

            return shader;
        }

        function createProgram(gl) {
            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            const program = gl.createProgram();

            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);

            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Error linking program:', gl.getProgramInfoLog(program));
                gl.deleteProgram(program);
                return null;
            }

            return program;
        }

        function renderCanvas(canvas, configuration) {
            const gl = canvas.getContext('webgl2');

            if (!gl) {
                console.error('WebGL2 is not supported by this browser.');
                return;
            }

            const program = createProgram(gl);
            const buffer = gl.createBuffer();
            const positionLocation = gl.getAttribLocation(program, 'position');
            const colorLocation = gl.getUniformLocation(program, 'color');
            const parts = configuration.parts || [configuration];

            gl.useProgram(program);
            gl.enableVertexAttribArray(positionLocation);
            gl.clearColor(1.0, 1.0, 1.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            parts.forEach(part => {
                if (part.vertices.length === 0) {
                    return;
                }

                gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(part.vertices), gl.STATIC_DRAW);
                gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
                gl.uniform4fv(colorLocation, part.color);
                gl.drawArrays(gl[part.mode], 0, part.vertices.length / 2);
            });
        }

        const allCanvas = document.querySelectorAll('canvas');
        allCanvas.forEach((canvas, index) => {
            renderCanvas(canvas, canvasConfigurations[index]);
        });
    </script>
</body>
</html>
